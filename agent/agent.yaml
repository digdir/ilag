# The ilag development Agent: Claude Code in a Sandbox with a checkout of digdir/ilag, Node 24, pnpm and Podman
# for the repository's PostgreSQL compose file. See README.md beside this file.
apiVersion: agents.platform/v1alpha1
kind: Agent
metadata:
  name: ilag
spec:
  sandbox:
    # Built from the Dockerfile beside this manifest. Paths in a manifest resolve against its directory.
    image:
      type: build
      context: .
      dockerfile: Dockerfile
    platform:
      os: linux
    resources:
      # Next.js builds and the PostgreSQL container need room.
      cpu: "4"
      memory: "8Gi"
      # Direct, not layered: Podman's overlay storage cannot run on a layered (overlayfs) root filesystem, so
      # `pnpm db:up` would fail.
      rootFilesystem:
        capacity: "64Gi"
        mode: direct
    # The base image boots systemd, which Podman's socket and the boot-time clone need.
    initSystem: image
  home:
    source: home
  # Installed where each harness reads its instructions; for Claude Code, ~/.claude/CLAUDE.md. The repository's own
  # CLAUDE.md is discovered by the harness inside the checkout.
  instructions:
    - source: instructions.md
    - source: improving.md
  harnesses:
    # Mediated: the Claude login stays on the host, and the Sandbox sees only a placeholder. `login: any` uses
    # whichever login is stored with `agentctl claude login [NAME]`, however it is named.
    - type: claudeCode
      auth: mediated
      default: true
      login: any
    # Codex, when a login is stored with `agentctl codex login`; without one, the Agent starts without it.
    - type: codex
      login: any
      optional: true
  # The GitHub account the Agent acts as, stored on the host with `agentctl github login default`. The Sandbox gets a
  # GITHUB_TOKEN placeholder for GitHub's hosts, and Git commits as the account. To keep the Agent to digdir/ilag, give
  # the login a fine-grained token on it, with Contents and Pull requests read and write.
  accounts:
    - type: github
      login: default
  access:
    - type: ssh
  # All traffic passes through the host's network mediator. Narrow `allow` once the traffic is known.
  network:
    mode: mediated
    allow: all
    deny:
      - metadata.google.internal
