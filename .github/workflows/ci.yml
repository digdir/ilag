# Lint, type checks and tests for every pull request to main.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request supersedes the run for the previous one.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.21.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:web

  test:
    runs-on: ubuntu-latest
    services:
      # Same image and credentials as docker-compose.yml, which .env.example
      # points DATABASE_URL at.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ilag
          POSTGRES_PASSWORD: ilag
          POSTGRES_DB: ilag_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ilag -d ilag_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.21.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Creates the .env files, with a PAYLOAD_SECRET generated for this run.
      # `run` is needed: some pnpm versions run their own built-in `setup`
      # command, which installs pnpm globally, instead of the script.
      - run: pnpm run setup
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ilag
          POSTGRES_PASSWORD: ilag
          POSTGRES_DB: ilag_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ilag -d ilag_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.21.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup
      - run: pnpm --filter cms exec playwright install --with-deps chromium
      # Playwright starts both dev servers itself (webServer in
      # src/cms/playwright.config.ts).
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report
          path: src/cms/playwright-report/
          retention-days: 7
