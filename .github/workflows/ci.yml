# Lint, type checks and tests for every pull request to main. Jobs and steps
# that the changed files cannot affect are skipped; see the `changes` job.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request supersedes the run for the previous one.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Decides what the pull request can affect. lint, test and e2e are required
  # status checks, so they are skipped with `if:` (a skipped job counts as
  # passed) instead of with a `paths:` filter on the workflow, which would leave
  # them pending. If this job fails, the others run everything.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      cms: ${{ steps.filter.outputs.cms }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          cms=false
          web=false
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          while IFS= read -r f; do
            case "$f" in
              '') ;;
              # Documentation, the prototype and the sandbox agent are not
              # built or tested.
              *.md | docs/* | prototype/* | agent/* | .claude/* | .mcp.json) ;;
              # Not used in CI: Postgres is a service below, and the
              # prototype deploys from its own workflow.
              docker-compose.yml | scripts/dev-switch.mjs | renovate.json | .gitignore | .github/workflows/deploy-prototype.yml) ;;
              # The shared package is used by both.
              src/shared/*) cms=true web=true ;;
              src/cms/*) cms=true ;;
              src/web/*) web=true ;;
              # Anything else, such as the lockfile, root config, the setup
              # script or this workflow, can affect both.
              *) cms=true web=true ;;
            esac
          done <<< "$files"
          echo "cms=$cms" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "Changed files:"; echo "$files"
          echo "cms=$cms web=$web"

  lint:
    needs: changes
    # Runs when the filter failed, so a broken filter never skips a check.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.cms == 'true' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.21.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
        if: ${{ needs.changes.outputs.cms != 'false' }}
      - run: pnpm check:web
        if: ${{ needs.changes.outputs.web != 'false' }}
      - run: pnpm check:cms
        if: ${{ needs.changes.outputs.cms != 'false' }}

  test:
    needs: changes
    # Runs when the filter failed, so a broken filter never skips a check.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.cms == 'true' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    services:
      # Same image and credentials as docker-compose.yml, which .env.example
      # points DATABASE_URL at.
      postgres:
        image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
        env:
          POSTGRES_USER: ilag
          POSTGRES_PASSWORD: ilag
          POSTGRES_DB: ilag_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ilag -d ilag_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.21.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Creates the .env files, with a PAYLOAD_SECRET generated for this run.
      # `run` is needed: some pnpm versions run their own built-in `setup`
      # command, which installs pnpm globally, instead of the script.
      - run: pnpm run setup
      - run: pnpm test:int
        if: ${{ needs.changes.outputs.cms != 'false' }}
      - run: pnpm test:web
        if: ${{ needs.changes.outputs.web != 'false' }}

  e2e:
    needs: changes
    # Runs when the filter failed, so a broken filter never skips a check.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.cms == 'true' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
        env:
          POSTGRES_USER: ilag
          POSTGRES_PASSWORD: ilag
          POSTGRES_DB: ilag_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ilag -d ilag_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.21.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup
      - run: pnpm --filter cms exec playwright install --with-deps chromium
      # Playwright starts both dev servers itself (webServer in
      # src/cms/playwright.config.ts).
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report
          path: src/cms/playwright-report/
          retention-days: 7
